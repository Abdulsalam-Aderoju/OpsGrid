services:
  frontend:
    image: gcr.io/google-samples/microservices-demo/frontend
    tag: v0.8.0
    replicas: 1
    port: 8080
    env:
      PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"
      CURRENCY_SERVICE_ADDR: "currencyservice:7000"
      CART_SERVICE_ADDR: "cartservice:7070"
      RECOMMENDATION_SERVICE_ADDR: "recommendationservice:8080"
      SHIPPING_SERVICE_ADDR: "shippingservice:50051"
      CHECKOUT_SERVICE_ADDR: "checkoutservice:5050"
      AD_SERVICE_ADDR: "adservice:9555"
      ENABLE_PROFILER: "0"
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"

  cartservice:
    image: gcr.io/google-samples/microservices-demo/cartservice
    tag: v0.8.0
    replicas: 1
    port: 7070
    env:
      REDIS_ADDR: "redis-cart:6379"
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "300m"
        memory: "128Mi"

  productcatalogservice:
    image: gcr.io/google-samples/microservices-demo/productcatalogservice
    tag: v0.8.0
    replicas: 1
    port: 3550
    env:
      ENABLE_PROFILER: "0"
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"

  currencyservice:
    image: gcr.io/google-samples/microservices-demo/currencyservice
    tag: v0.8.0
    replicas: 1
    port: 7000
    env:
      PORT: "7000"
      DISABLE_PROFILER: "1"
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"

  paymentservice:
    image: gcr.io/google-samples/microservices-demo/paymentservice
    tag: v0.8.0
    replicas: 1
    port: 50051
    env:
      PORT: "50051"
      DISABLE_PROFILER: "1"
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"

  shippingservice:
    image: gcr.io/google-samples/microservices-demo/shippingservice
    tag: v0.8.0
    replicas: 1
    port: 50051
    env:
      ENABLE_PROFILER: "0"
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"

  emailservice:
    image: gcr.io/google-samples/microservices-demo/emailservice
    tag: v0.8.0
    replicas: 1
    port: 8080
    env:
      ENABLE_PROFILER: "0"
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"

  checkoutservice:
    image: gcr.io/google-samples/microservices-demo/checkoutservice
    tag: v0.8.0
    replicas: 1
    port: 5050
    env:
      PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"
      SHIPPING_SERVICE_ADDR: "shippingservice:50051"
      PAYMENT_SERVICE_ADDR: "paymentservice:50051"
      EMAIL_SERVICE_ADDR: "emailservice:8080"
      CURRENCY_SERVICE_ADDR: "currencyservice:7000"
      CART_SERVICE_ADDR: "cartservice:7070"
      ENABLE_PROFILER: "0"
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"

  recommendationservice:
    image: gcr.io/google-samples/microservices-demo/recommendationservice
    tag: v0.8.0
    replicas: 1
    port: 8080
    env:
      PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"
      ENABLE_PROFILER: "0"
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"

  adservice:
    image: gcr.io/google-samples/microservices-demo/adservice
    tag: v0.8.0
    replicas: 1
    port: 9555
    env:
      ENABLE_PROFILER: "0"
    resources:
      requests:
        cpu: "100m"
        memory: "180Mi"
      limits:
        cpu: "300m"
        memory: "300Mi"

  loadgenerator:
    image: gcr.io/google-samples/microservices-demo/loadgenerator
    tag: v0.8.0
    replicas: 1
    env:
      FRONTEND_ADDR: "frontend:8080"
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

redis:
  image: redis
  tag: alpine
  port: 6379
  resources:
    requests:
      cpu: "50m"
      memory: "200Mi"
    limits:
      cpu: "125m"
      memory: "256Mi"